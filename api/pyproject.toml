[project]
name = "seaplane-api"
version = "0.1.0"
description = "Michigan seaplane lake map api service: daily briefing generator and wind proxy"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "httpx>=0.27",
    "pydantic>=2.7",
    "tzdata>=2024.1",
]

[project.scripts]
seaplane-api = "seaplane_api.cli:main"

[dependency-groups]
dev = ["pytest>=8.2", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["seaplane_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"
