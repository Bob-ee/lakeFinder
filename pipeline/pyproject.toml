[project]
name = "seaplane-pipeline"
version = "0.1.0"
description = "Michigan seaplane lake map data pipeline"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "lxml>=5.2",
    "pyyaml>=6.0",
    "pydantic>=2.7",
    "anthropic>=0.40",
    "geopandas>=1.0",
    "shapely>=2.0",
    "pyproj>=3.6",
    "numpy>=1.26",
    "rich>=13.7",
]

[project.scripts]
seaplane = "seaplane_pipeline.cli:main"

[dependency-groups]
dev = ["pytest>=8.2", "pytest-cov>=5.0", "ruff>=0.5"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["seaplane_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py312"
